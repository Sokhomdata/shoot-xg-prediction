version: 2

models:
  - name: facts_events
    description: "Table de faits contenant les événements de jeu. Elle permet notamment de reconstituer les séquences d'actions précédant un tir."
    columns:
      - name: event_id
        description: "Identifiant unique de l'événement."
        tests:
          - not_null
          - unique

      - name: related_event_id
        description: "Identifiant d'un événement lié à l'événement courant."

      - name: period
        description: "Période du match."

      - name: minute
        description: "Minute de l'événement."

      - name: second
        description: "Seconde de l'événement."

      - name: action_id
        description: "Identifiant du type d'action."

      - name: play_actor_id
        description: "Identifiant du joueur réalisant l'action."

      - name: x_actor
        description: "Coordonnée X de l'acteur au moment de l'action."

      - name: y_actor
        description: "Coordonnée Y de l'acteur au moment de l'action."

      - name: player_target_id
        description: "Identifiant du joueur cible de l'action."

      - name: x_target
        description: "Coordonnée X de la cible de l'action."

      - name: y_target
        description: "Coordonnée Y de la cible de l'action."

      - name: possession
        description: "Identifiant de la séquence de possession."

  - name: facts_shots
    description: "Table de faits contenant un enregistrement par tir effectué pendant un match."
    columns:
      - name: shot_id
        description: "Identifiant unique du tir."
        tests:
          - unique
          - not_null

      - name: match_id
        description: "Identifiant du match."

      - name: striker_id
        description: "Identifiant du joueur ayant effectué le tir."

      - name: team_id
        description: "Identifiant de l'équipe du tireur."

      - name: event_id
        description: "Identifiant de l'événement correspondant au tir."

      - name: x
        description: "Coordonnée X du tir."

      - name: y
        description: "Coordonnée Y du tir."

      - name: minute
        description: "Minute du match au moment du tir."

      - name: second
        description: "Seconde de la minute au moment du tir."

      - name: period
        description: "Période du match durant laquelle le tir est effectué."

      - name: position_id
        description: "Identifiant du poste occupé par le joueur au moment du tir."

      - name: outcome_name
        description: "Résultat du tir selon la nomenclature StatsBomb."
        
      - name: body_part_id
        description: "Partie du corps utilisée pour réaliser le tir."

      - name: xg
        description: "Valeur xG fournie par StatsBomb (à utiliser uniquement comme référence et non comme variable d'entraînement)."

      - name: outcome_id
        description: "Identifiant du résultat du tir."

      - name: under_pressure
        description: "Indique si le tir a été effectué sous pression."

      - name: first_time
        description: "Indique si le tir est réalisé en première intention."

      - name: shot_type_id
        description: "Identifiant du type de tir."

      - name: play_pattern_id
        description: "Identifiant de la phase de jeu."

      - name: technique_id
        description: "Identifiant de la technique utilisée pour réaliser le tir."