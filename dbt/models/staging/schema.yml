version: 2

models:
  - name: stg_competitions
    description: "Table de staging des compétitions StatsBomb."
    columns:
      - name: competition_id
        description: "Identifiant de la compétition."
        tests:
          - not_null

      - name: season_id
        description: "Identifiant de la saison."

      - name: competition_name
        description: "Nom de la compétition."

      - name: season_name
        description: "Nom de la saison."

      - name: country_name
        description: "Pays de la compétition."

      - name: competition_gender
      - name: competition_international
      - name: competition_youth
      - name: match_available
      - name: match_available_360
      - name: match_updated
      - name: match_updated_360

  - name: stg_events
    description: "Table de staging des événements StatsBomb."
    columns:
      - name: match_id
        description: "Identifiant du match."
        tests:
          - not_null

      - name: event_id
        description: "Identifiant unique de l'événement."
        tests:
          - unique
          - not_null

      - name: event_index
      - name: period
      - name: minute
      - name: second
      - name: event_timestamp
      - name: duration

      - name: x
      - name: y

      - name: team_id
      - name: team_name

      - name: player_id
      - name: player_name

      - name: position_id
      - name: position_name

      - name: possession
      - name: possession_team_id
      - name: possession_team_name

      - name: play_pattern_id
      - name: play_pattern_name

      - name: type_id
      - name: type_name

      - name: outcome_id
      - name: outcome_name

      - name: technique_id
      - name: technique_name

      - name: shot_type_id
      - name: shot_type_name

      - name: xg
      - name: under_pressure
      - name: first_time

      - name: pass_angle
      - name: pass_length
      - name: pass_end_x
      - name: pass_end_y

      - name: recipient_id
      - name: recipient_name

      - name: body_part_id
      - name: body_part_name

      - name: pass_height_id
      - name: pass_height_name

      - name: related_event1
      - name: related_event2
      - name: related_event3
      - name: related_event4

  - name: stg_lineups
    description: "Table de staging des compositions d'équipes."
    columns:
      - name: team_id
        description: "Identifiant de l'équipe."
        tests:
          - not_null

      - name: team_name

      - name: player_id
        description: "Identifiant du joueur."
        tests:
          - not_null

      - name: player_name

      - name: position_id
      - name: position_name

      - name: start_reason
      - name: end_reason

      - name: from_time
      - name: to_time

      - name: from_period
      - name: to_period

  - name: stg_matches
    description: "Table de staging des matchs StatsBomb."
    columns:
      - name: match_id
        description: "Identifiant unique du match."
        tests:
          - unique
          - not_null

      - name: match_week
      - name: match_date
      - name: kick_off

      - name: match_status
      - name: match_status_360

      - name: competition_id
      - name: competition_name
      - name: competition_country

      - name: season_id
      - name: season_name

      - name: competition_stage_id
      - name: competition_stage_name

      - name: home_team_id
      - name: home_team_name
      - name: home_team_gender
      - name: home_team_country

      - name: away_team_id
      - name: away_team_name
      - name: away_team_gender
      - name: away_team_country

      - name: home_score
      - name: away_score

      - name: referee_id
      - name: referee_name
      - name: referee_country

      - name: stadium_id
      - name: stadium_name
      - name: stadium_country

      - name: data_version
      - name: shot_fidelity_version
      - name: xy_fidelity_version

      - name: last_updated
      - name: last_updated_360